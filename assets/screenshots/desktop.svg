<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Desktop preview placeholder</title>
  <desc id="desc">A stylized preview card for the dotfiles README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="0.55" stop-color="#313244"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="term" x1="0" x2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="160" r="220" fill="#f5c2e7" opacity="0.16"/>
  <circle cx="220" cy="760" r="260" fill="#89b4fa" opacity="0.14"/>
  <rect x="42" y="32" width="1516" height="46" rx="18" fill="#11111b" opacity="0.9"/>
  <text x="78" y="62" fill="#cdd6f4" font-family="monospace" font-size="22">1:term</text>
  <text x="210" y="62" fill="#a6e3a1" font-family="monospace" font-size="22">2:web</text>
  <text x="330" y="62" fill="#89b4fa" font-family="monospace" font-size="22">3:code</text>
  <text x="1360" y="62" fill="#f9e2af" font-family="monospace" font-size="22">debian sway</text>
  <rect x="98" y="128" width="640" height="590" rx="24" fill="url(#term)" filter="url(#shadow)"/>
  <rect x="118" y="150" width="600" height="42" rx="14" fill="#313244"/>
  <circle cx="146" cy="171" r="8" fill="#f38ba8"/>
  <circle cx="174" cy="171" r="8" fill="#f9e2af"/>
  <circle cx="202" cy="171" r="8" fill="#a6e3a1"/>
  <text x="142" y="250" fill="#89b4fa" font-family="monospace" font-size="30">~/dotfiles</text>
  <text x="142" y="305" fill="#cdd6f4" font-family="monospace" font-size="26">$ changeTheme mocha</text>
  <text x="142" y="360" fill="#a6e3a1" font-family="monospace" font-size="26">Theme changed: mocha</text>
  <text x="142" y="430" fill="#cdd6f4" font-family="monospace" font-size="26">$ post-install-check</text>
  <text x="142" y="485" fill="#a6e3a1" font-family="monospace" font-size="26">sway, waybar, nvim, ghostty: ok</text>
  <text x="142" y="540" fill="#f5c2e7" font-family="monospace" font-size="26">portable Debian restore path</text>
  <rect x="810" y="128" width="690" height="280" rx="24" fill="#11111b" opacity="0.94" filter="url(#shadow)"/>
  <text x="858" y="210" fill="#cdd6f4" font-family="monospace" font-size="34">Sway + Waybar</text>
  <text x="858" y="270" fill="#a6adc8" font-family="monospace" font-size="24">keyboard-first desktop</text>
  <text x="858" y="320" fill="#a6adc8" font-family="monospace" font-size="24">media keys, rofi, notifications</text>
  <rect x="810" y="450" width="690" height="268" rx="24" fill="#11111b" opacity="0.94" filter="url(#shadow)"/>
  <text x="858" y="535" fill="#cdd6f4" font-family="monospace" font-size="34">Paperless + Server</text>
  <text x="858" y="595" fill="#a6adc8" font-family="monospace" font-size="24">scan, consume, export, mirror</text>
  <text x="858" y="645" fill="#a6adc8" font-family="monospace" font-size="24">private values live outside git</text>
  <text x="110" y="820" fill="#6c7086" font-family="monospace" font-size="24">placeholder: replace with a real desktop screenshot</text>
</svg>
