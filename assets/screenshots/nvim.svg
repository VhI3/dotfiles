<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Neovim preview placeholder</title>
  <desc id="desc">A stylized Neovim terminal preview card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#313244"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect x="46" y="42" width="1108" height="58" rx="18" fill="#1e1e2e"/>
  <circle cx="86" cy="71" r="10" fill="#f38ba8"/>
  <circle cx="122" cy="71" r="10" fill="#f9e2af"/>
  <circle cx="158" cy="71" r="10" fill="#a6e3a1"/>
  <text x="220" y="79" fill="#cdd6f4" font-family="monospace" font-size="26">nvim lua/config/keymaps.lua</text>
  <rect x="46" y="128" width="258" height="558" rx="18" fill="#181825"/>
  <text x="78" y="182" fill="#89b4fa" font-family="monospace" font-size="24">config</text>
  <text x="96" y="232" fill="#cdd6f4" font-family="monospace" font-size="22">keymaps.lua</text>
  <text x="96" y="274" fill="#a6adc8" font-family="monospace" font-size="22">options.lua</text>
  <text x="96" y="316" fill="#a6adc8" font-family="monospace" font-size="22">theme.lua</text>
  <text x="78" y="392" fill="#89b4fa" font-family="monospace" font-size="24">plugins</text>
  <text x="96" y="442" fill="#a6adc8" font-family="monospace" font-size="22">lsp.lua</text>
  <text x="96" y="484" fill="#a6adc8" font-family="monospace" font-size="22">latex.lua</text>
  <text x="96" y="526" fill="#a6adc8" font-family="monospace" font-size="22">ipynb.lua</text>
  <rect x="330" y="128" width="824" height="558" rx="18" fill="#11111b"/>
  <text x="370" y="188" fill="#f5c2e7" font-family="monospace" font-size="24">-- IDE-like debugging keys</text>
  <text x="370" y="246" fill="#89b4fa" font-family="monospace" font-size="24">vim.keymap.set</text>
  <text x="566" y="246" fill="#cdd6f4" font-family="monospace" font-size="24">("n", "&lt;F5&gt;", dap.continue)</text>
  <text x="370" y="304" fill="#89b4fa" font-family="monospace" font-size="24">vim.keymap.set</text>
  <text x="566" y="304" fill="#cdd6f4" font-family="monospace" font-size="24">("n", "&lt;F9&gt;", dap.toggle_breakpoint)</text>
  <text x="370" y="362" fill="#89b4fa" font-family="monospace" font-size="24">vim.keymap.set</text>
  <text x="566" y="362" fill="#cdd6f4" font-family="monospace" font-size="24">("n", "&lt;F10&gt;", dap.step_over)</text>
  <text x="370" y="470" fill="#a6e3a1" font-family="monospace" font-size="24">LazyVim, LSP, DAP, LaTeX, notebooks</text>
  <text x="370" y="532" fill="#f9e2af" font-family="monospace" font-size="24">nvim-repair for future plugin cache issues</text>
</svg>
