<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Paperless workflow placeholder</title>
  <desc id="desc">A stylized Paperless document workflow card.</desc>
  <rect width="1200" height="760" rx="34" fill="#eff1f5"/>
  <circle cx="1040" cy="120" r="190" fill="#dc8a78" opacity="0.18"/>
  <circle cx="150" cy="650" r="210" fill="#1e66f5" opacity="0.12"/>
  <text x="70" y="90" fill="#4c4f69" font-family="monospace" font-size="42">Paperless document flow</text>
  <g font-family="monospace" font-size="26">
