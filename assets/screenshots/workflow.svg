<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Home server workflow placeholder</title>
  <desc id="desc">A stylized home server restore and media workflow card.</desc>
  <rect width="1200" height="760" rx="34" fill="#181825"/>
  <text x="70" y="92" fill="#cdd6f4" font-family="monospace" font-size="42">Portable home server setup</text>
  <g font-family="monospace" font-size="24">
    <rect x="80" y="155" width="285" height="150" rx="24" fill="#313244"/>
    <text x="120" y="215" fill="#89b4fa">AppData</text>
    <text x="120" y="260" fill="#a6adc8">Docker Compose apps</text>
    <rect x="455" y="155" width="285" height="150" rx="24" fill="#313244"/>
    <text x="495" y="215" fill="#a6e3a1">Documents_1</text>
    <text x="495" y="260" fill="#a6adc8">master SSD</text>
    <rect x="830" y="155" width="285" height="150" rx="24" fill="#313244"/>
    <text x="870" y="215" fill="#f38ba8">Documents_2</text>
    <text x="870" y="260" fill="#a6adc8">mirror HDD</text>
    <rect x="80" y="440" width="285" height="150" rx="24" fill="#313244"/>
    <text x="120" y="500" fill="#f9e2af">Media shares</text>
    <text x="120" y="545" fill="#a6adc8">Jellyfin/Navidrome</text>
    <rect x="455" y="440" width="285" height="150" rx="24" fill="#313244"/>
    <text x="495" y="500" fill="#f5c2e7">Paperless</text>
    <text x="495" y="545" fill="#a6adc8">scan/export/restore</text>
    <rect x="830" y="440" width="285" height="150" rx="24" fill="#313244"/>
    <text x="870" y="500" fill="#94e2d5">Bootstrap</text>
    <text x="870" y="545" fill="#a6adc8">fresh server recovery</text>
  </g>
  <g stroke="#6c7086" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M740 230 H830"/>
    <path d="M598 305 V440"/>
    <path d="M365 515 H455"/>
    <path d="M740 515 H830"/>
  </g>
  <text x="80" y="690" fill="#6c7086" font-family="monospace" font-size="24">private hostnames, IPs, credentials, and mounts stay in ignored local env files</text>
</svg>
