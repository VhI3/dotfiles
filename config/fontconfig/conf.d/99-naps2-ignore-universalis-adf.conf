<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Work around a NAPS2/PdfSharpCore crash while scanning to PDF:

      System.ArgumentException: An item with the same key has already been added.
      Key: universalis adf std cond

    Debian's Universalis ADF font package exposes condensed variants with names
    that differ only by case. PdfSharpCore normalizes those names and crashes on
    the duplicate key. Hide just this family from the user font list instead of
    removing the package globally.
  -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Universalis ADF Std</string>
        </patelt>
      </pattern>
    </rejectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Universalis ADF Std Cond</string>
        </patelt>
      </pattern>
    </rejectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Universalis ADF Std cond</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
